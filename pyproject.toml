[project]
name = "dovera"
version = "2.0.0"
description = "Universal document verification against project checklists. LangGraph + LangChain agent, Streamlit UI, GraphQL result store. Ships with the Annex 13 (Czech Decree 499/2006 Sb.) construction-documentation checklist."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Korotetskyi", email = "korotole@cvut.cz" }]
dependencies = [
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.12",
    "pdf2image>=1.17.0",
    "pypdf>=6.19.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "fastapi>=0.142.1",
    "ariadne==0.25",
    "uvicorn>=0.37.0",
    "pandas>=2.0",
]

[project.scripts]
dovera = "dovera.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "reportlab>=5.0.1"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = ["e2e: end-to-end test calling the LLM (deselect with -m 'not e2e')"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dovera"]
