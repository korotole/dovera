[project]
name = "annex13-checker"
version = "1.0.0"
description = "Checks construction project documentation (PDF/DOCX, incl. scanned) against Annex 13 of Czech Decree 499/2006 Sb. LangGraph + LangChain agent, Streamlit UI, GraphQL result store."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Korotetskyi", email = "korotole@cvut.cz" }]
dependencies = [
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "pdf2image>=1.17.0",
    "pypdf>=6.19.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "fastapi>=0.142.1",
    "ariadne==0.25",
    "uvicorn>=0.37.0",
    "pandas>=2.0",
]

[project.scripts]
annex13 = "invoice_agent.main:main"
annex13-ui = "invoice_agent.serve:ui"
annex13-store = "invoice_agent.store:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "reportlab>=5.0.1"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = ["e2e: end-to-end test calling the LLM (deselect with -m 'not e2e')"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoice_agent"]
